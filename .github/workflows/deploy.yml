name: Deploy to GCP Compute Engine

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드를 가져옵니다 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Java 17을 설정합니다
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 캐시를 설정합니다 (빌드 속도 향상)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 4. Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 5. Gradle 빌드 수행 (CI 환경 테스트 제외)
        run: ./gradlew build -x test

      - name: 6. Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 6-1. Docker Hub 시크릿 주입 진단
        run: |
          echo "=== Secret/Variable 주입 진단 ==="
          if [ -n "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_HUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKER_HUB_TOKEN }}" ]; then
            echo "✅ Docker Hub Token/Password가 감지되었습니다."
          else
            echo "❌ Docker Hub Token/Password가 감지되지 않았습니다. (Secrets 또는 Variables 설정을 확인하세요)"
          fi

      - name: 7. Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || vars.DOCKERHUB_USERNAME || vars.DOCKER_HUB_USERNAME || 'ministar93' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_HUB_PASSWORD || vars.DOCKERHUB_TOKEN || vars.DOCKER_HUB_TOKEN || vars.DOCKERHUB_PASSWORD || vars.DOCKER_HUB_PASSWORD }}

      - name: 8. Docker 이미지 빌드 및 푸시 (GCP e2-micro용 linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || vars.DOCKERHUB_USERNAME || 'ministar93' }}/honey-budget:latest
            ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || vars.DOCKERHUB_USERNAME || 'ministar93' }}/honey-budget:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 9. SSH를 통해 GCP 서버에 접속하여 자동 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST || vars.GCP_HOST || '35.254.156.249' }}
          username: ${{ secrets.GCP_USERNAME || vars.GCP_USERNAME || 'oblilic93' }}
          key: ${{ secrets.GCP_SSH_KEY || vars.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || vars.GCP_SSH_PORT || 22 }}
          script: |
            # 배포 디렉토리로 이동
            cd ~/honey-budget || mkdir -p ~/honey-budget && cd ~/honey-budget
            
            # Docker Hub 최신 이미지 다운로드
            docker pull ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_HUB_USERNAME || vars.DOCKERHUB_USERNAME || 'ministar93' }}/honey-budget:latest
            
            # 컨테이너 무중단 갱신 및 재실행
            docker compose up -d --remove-orphans
            
            # 불필요한 구버전 이미지 정리 (디스크 절약)
            docker image prune -f
