name: Deploy to GCP Compute Engine

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드를 가져옵니다 (Checkout)
        uses: actions/checkout@v4

      - name: 2. Java 17을 설정합니다
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 캐시를 설정합니다 (빌드 속도 향상)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 4. Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 5. Gradle 빌드 및 테스트 수행
        run: ./gradlew build

      - name: 6. Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 7. Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 8. Docker 이미지 빌드 및 푸시 (GCP e2-micro용 linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/honey-budget:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/honey-budget:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 9. SSH를 통해 GCP 서버에 접속하여 자동 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          script: |
            # 배포 디렉토리로 이동
            cd ~/honey-budget || mkdir -p ~/honey-budget && cd ~/honey-budget
            
            # Docker Hub 최신 이미지 다운로드
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/honey-budget:latest
            
            # 컨테이너 무중단 갱신 및 재실행
            docker compose up -d --remove-orphans
            
            # 불필요한 구버전 이미지 정리 (디스크 절약)
            docker image prune -f
